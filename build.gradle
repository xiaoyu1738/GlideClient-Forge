buildscript {
    repositories {
        mavenCentral()
        jcenter()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
//            url = "http://files.minecraftforge.net/maven"
        }
        maven {
            name = 'sponge'
            url = 'https://repo.spongepowered.org/maven'
        }
        maven {
            url = 'https://jitpack.io'
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
        classpath 'com.github.jengelman.gradle.plugins:shadow:2.0.4'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'
apply plugin: 'com.github.johnrengelman.shadow'

version = "7.2-forge.2"
group = "me.eldodebug"
archivesBaseName = "GlideClient-Forge"

sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = 'UTF-8'

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    clientJvmArgs = ["-XX:-DisableExplicitGC"]
    makeObfSourceJar = false
}

repositories {
    maven {
        name "jitpack"
        url "https://jitpack.io"
    }

    maven {
        name "spongepowered"
        url "https://repo.spongepowered.org/maven/"
    }
    jcenter()
    mavenCentral()
}

configurations {
    embed
    compile.extendsFrom(embed)
}

dependencies {
    // Use the same Mixin line as current Forge client mods (NEU, PolyPatcher,
    // and OneConfig). Embedding 0.7.11 causes their accessor mixins to be
    // parsed by an older transformer and silently skipped.
    embed('org.spongepowered:mixin:0.8.7') {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
        exclude module: 'commons-io'
    }
    embed 'org.ow2.asm:asm:9.7.1'
    embed 'org.ow2.asm:asm-analysis:9.7.1'
    embed 'org.ow2.asm:asm-commons:9.7.1'
    embed 'org.ow2.asm:asm-tree:9.7.1'
    embed 'org.ow2.asm:asm-util:9.7.1'
    embed(files('libs/lwjgl-soar.jar'))
    embed(files('libs/lwjgl-soar-natives.jar'))
    testCompile 'junit:junit:4.13.2'
}

mixin {
    defaultObfuscationEnv = "searge"
}

// MixinGradle 0.6 schedules `add` in addition to its own source-set scan,
// registering the same compile hook twice. Set the source-set extension
// directly so the plugin configures the refmap once during afterEvaluate.
sourceSets.main.ext.refMap = "mixins.soar.refmap.json"

// Runtime smoke automation is packaged as a separate Forge mod and is never
// included in the distributable Glide jar.
sourceSets {
    smoke {
        java.srcDir 'src/smoke/java'
        compileClasspath = sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", "1.8.9"

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": "1.8.9"
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }

    from(rootProject.file('LICENSE')) {
        into 'META-INF/licenses'
        rename { 'GlideClient-GPLv3.txt' }
    }
}

jar {
    manifest.attributes(
            "TweakClass": 'me.eldodebug.soar.bootstrap.GlideMixinTweaker',
            "TweakOrder": 1001,
            'FMLAT': 'soar_at.cfg',
            "ModSide": 'CLIENT'
    )
}

shadowJar {
    classifier = ''
    configurations = [project.configurations.embed]
    relocate('org.objectweb.asm', 'me.eldodebug.soar.internal.asm') {
        exclude 'org.objectweb.asm.commons.Remapper'
    }
    mergeServiceFiles()
    from {
        sourceSets.main.output
    }
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    // ForgeGradle 2.1's reobfuscator uses an ASM version that cannot parse
    // the Java 9 module descriptor bundled by Mixin 0.8.x.
    exclude 'module-info.class'
    // These Java 16 ModLauncher adapters are unused on the 1.8.9
    // LaunchWrapper runtime and cannot be parsed by ForgeGradle 2.1 either.
    exclude 'org/spongepowered/asm/launch/MixinLaunchPlugin.class'
    exclude 'org/spongepowered/asm/launch/MixinTransformationService.class'
    exclude 'org/spongepowered/asm/launch/platform/container/ContainerHandleModLauncherEx*.class'
    // Mixin's Forge bridge intentionally shares this API-compatible base
    // type with Forge's FMLDeobfuscatingRemapper.
    exclude 'org/objectweb/asm/commons/Remapper.class'
    // The vanilla 1.8.9 LWJGL 2 jar seals the exact org.lwjgl package.
    // Glide only needs the NanoVG/OpenCL subpackages from lwjgl-soar; do not
    // ship its unrelated LWJGL 3 root-package classes into that sealed package.
    exclude 'org/lwjgl/CLongBuffer.class'
    exclude 'org/lwjgl/Version*.class'
    exclude 'org/lwjgl/package-info.class'
    // The custom native bundle also contains Yoga and Zstd, but Glide only
    // uses the LWJGL core, NanoVG, and STB bindings. Native libraries are
    // stored below platform/<arch>/org/lwjgl/{yoga,zstd}, unlike the Java
    // bindings which live below org/lwjgl/util/.
    exclude '**/org/lwjgl/util/yoga/**'
    exclude '**/org/lwjgl/util/zstd/**'
    exclude '**/org/lwjgl/yoga/**'
    exclude '**/org/lwjgl/zstd/**'
    manifest.inheritFrom jar.manifest
}

reobf {
    shadowJar {
        mappingType = 'SEARGE'
    }
}

// The thin jar is not runnable because embedded Mixin/LWJGL dependencies are
// intentionally supplied only by shadowJar. Do not publish an easy-to-misuse
// second artifact.
jar.enabled = false
reobfJar.enabled = false

build.dependsOn reobfShadowJar

task smokeJar(type: Jar, dependsOn: smokeClasses) {
    baseName = 'GlideClient-Forge-Smoke'
    version = project.version
    from sourceSets.smoke.output
}

task verifyReleaseJar(dependsOn: reobfShadowJar) {
    doLast {
        File artifact = shadowJar.archivePath
        if (!artifact.isFile()) {
            throw new GradleException("Release artifact was not created: ${artifact}")
        }

        java.util.jar.JarFile releaseJar = new java.util.jar.JarFile(artifact)
        try {
            List<String> requiredEntries = [
                    'mcmod.info',
                    'mixins.soar.json',
                    'mixins.soar.windows.json',
                    'mixins.soar.refmap.json',
                    'META-INF/licenses/ASM.txt',
                    'META-INF/licenses/GlideClient-GPLv3.txt',
                    'META-INF/licenses/LWJGL.txt',
                    'META-INF/licenses/Mixin.txt',
                    'META-INF/licenses/NanoVG.txt',
                    'META-INF/licenses/stb.txt',
                    'me/eldodebug/soar/bootstrap/GlideMixinTweaker.class',
                    'me/eldodebug/soar/discord/ipc/entities/pipe/UnixPipe.class',
                    'me/eldodebug/soar/platform/PlatformUtils.class'
            ]
            requiredEntries.each { entry ->
                if (releaseJar.getEntry(entry) == null) {
                    throw new GradleException("Release artifact is missing ${entry}")
                }
            }

            Set<String> names = new HashSet<>()
            releaseJar.entries().each { entry ->
                String name = entry.name
                if (!names.add(name)) {
                    throw new GradleException("Release artifact contains duplicate entry ${name}")
                }
                if (name.startsWith('me/eldodebug/soar/smoke/')
                        || name.endsWith('Test.class')) {
                    throw new GradleException("Release artifact contains test-only entry ${name}")
                }
                String normalizedName = name.startsWith('/') ? name.substring(1) : name
                if (normalizedName.contains('org/lwjgl/util/yoga/')
                        || normalizedName.contains('org/lwjgl/util/zstd/')
                        || normalizedName.contains('org/lwjgl/yoga/')
                        || normalizedName.contains('org/lwjgl/zstd/')) {
                    throw new GradleException("Release artifact contains unused native entry ${name}")
                }
            }

            java.util.jar.Attributes attributes = releaseJar.manifest.mainAttributes
            if (attributes.getValue('TweakClass')
                    != 'me.eldodebug.soar.bootstrap.GlideMixinTweaker') {
                throw new GradleException('Release artifact has an invalid TweakClass manifest entry')
            }
            if (attributes.getValue('ModSide') != 'CLIENT') {
                throw new GradleException('Release artifact must be marked client-only')
            }
        } finally {
            releaseJar.close()
        }
    }
}

check.dependsOn verifyReleaseJar
